name: Deploy to Cloudflare Pages

# Replaces the manual `python scripts/build_site.py && npx wrangler pages
# deploy` steps (docs/README.md "Hosting") with an automatic deploy on every
# push to main. build_site.py only copies already-committed files (src/,
# data/generated/, data/rce/, data/pdok/, images/) using stdlib only -- no
# pip install needed, no data regeneration happens here.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See
# docs/ideas/006-hosting.md for how to obtain them.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python scripts/build_site.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name dodenakkers-zh --branch main
